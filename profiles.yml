# Export SNOWFLAKE_PRIVATE_KEY_PATH and SNOWFLAKE_DATABASE as environment variables
# or set them in the profiles.yml file

medallion_reference:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: SNOWFLAKE_JWT
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4

    duckdb:
      type: duckdb
      path: ./medallion-reference.duckdb
      schema: main
      threads: 4

    bigquery:
      type: bigquery
      method: oauth
      # No default: this project id is expected to move (e.g. to the strategic
      # partner's own GCP environment once that partnership formalizes), so it
      # must never be baked in as a fallback. Export BIGQUERY_PROJECT before
      # running against this target.
      project: "{{ env_var('BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET', 'medallion_reference') }}"
      location: "{{ env_var('BIGQUERY_LOCATION', 'US') }}"
      threads: 4
      # Cost guard (TD-4985): every query this profile issues refuses to run
      # over this many bytes. 100MB default per the interim GCP sanction;
      # override only with a documented justification.
      maximum_bytes_billed: "{{ env_var('BIGQUERY_MAXIMUM_BYTES_BILLED', 104857600) | int }}"
